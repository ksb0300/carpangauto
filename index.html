<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>비사업용 사실확인서 · 카팡모터스</title>
<meta name="description" content="카팡모터스 차량 매도 시 제출하는 비사업용 사실확인서입니다.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#f6f7f9;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
                "Malgun Gothic",sans-serif;}
  iframe{display:block;width:100%;height:100%;border:0;}
  /* 아직 주소를 넣지 않았을 때 보이는 안내 */
  .setup{max-width:520px;margin:0 auto;padding:70px 24px;color:#1a1c20;}
  .setup h1{font-size:21px;margin:0 0 10px;}
  .setup p{color:#6c727c;line-height:1.7;margin:0 0 8px;font-size:15px;}
  .setup code{background:#eceef1;padding:2px 6px;border-radius:5px;font-size:13px;}
</style>
</head>
<body>
<script>
  // 배포 후 이 한 줄만 실제 Apps Script 웹앱 주소로 바꾸면 된다.
  var 웹앱주소 = "";

  if (웹앱주소) {
    var f = document.createElement("iframe");
    f.src = 웹앱주소;
    f.setAttribute("allow", "clipboard-write");
    document.body.appendChild(f);
  } else {
    document.body.innerHTML =
      '<div class="setup"><h1>연결 준비 중입니다</h1>' +
      '<p>서명 페이지 주소가 아직 등록되지 않았습니다.</p>' +
      '<p><code>index.html</code>의 <code>웹앱주소</code> 값을 ' +
      'Apps Script 웹앱 URL로 채우면 이 화면 대신 확인서가 표시됩니다.</p></div>';
  }
</script>
</body>
</html>
