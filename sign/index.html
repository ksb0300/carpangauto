<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서류 작성 · CARPANG</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .doc{background:#fff;border-radius:16px;overflow:hidden;min-height:78vh;
    box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(139,47,255,.12)}
  .doc iframe{width:100%;height:80vh;border:0;display:block}
  .setup{padding:60px 24px;text-align:center;color:#6c727c;background:#fff}
  .setup b{display:block;color:#1a1c20;font-size:17px;margin-bottom:8px}
</style>
</head>
<body>

<section class="full short" style="padding-top:calc(var(--nav) + 44px)">
  <div class="wrap">
    <p class="eyebrow">Document</p>
    <h1 class="t">비사업용 사실확인서</h1>
    <p class="s">사업자등록증이 있으신 분 중, 차량을 경비처리하지 않으신 경우 작성해 주시는 서류입니다.
       휴대폰으로 바로 서명하실 수 있습니다.</p>
    <div class="doc" id="doc"></div>
  </div>
</section>

<script src="/assets/site.js"></script>
<script>
/* Apps Script 웹앱 주소. 직접 들어가면 구글이 '악용사례 신고' 배너를 붙여
   고객이 불안해한다. iframe 으로 감싸면 배너 없이 우리 도메인 안에서 열린다. */
var 웹앱주소 = "https://script.google.com/macros/s/AKfycbyJWw4vetW67C9zqc57C4ktTwnMgTTflS4znWK9rtXOovrTXibS9-_ew3d11hkD755C/exec";

document.getElementById("doc").innerHTML = 웹앱주소
  ? '<iframe src="' + 웹앱주소 + '" title="비사업용 사실확인서"></iframe>'
  : '<div class="setup"><b>연결 준비 중입니다</b>서명 페이지 주소가 아직 등록되지 않았습니다.</div>';
</script>
</body>
</html>
