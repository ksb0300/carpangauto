<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 차량 · CARPANG</title>
<meta name="description" content="카팡모터스가 현재 판매 중인 차량 목록입니다.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/style.css?v=8b3ed021">
<style>.empty{text-align:center;color:var(--tx3);padding:70px 0}</style>
</head>
<body>

<section class="full short" style="padding-top:calc(var(--nav) + 44px)">
  <div class="wrap">
    <p class="eyebrow">Inventory</p>
    <h1 class="t">판매 차량</h1>
    <p class="s" id="sub">불러오는 중…</p>
    <div class="bar" id="filters"></div>
    <div class="grid g4" id="grid"></div>
    <div class="empty" id="empty" style="display:none">해당 조건의 차량이 없습니다.</div>
  </div>
</section>

<script src="/assets/site.js?v=dbc73a0a"></script>
<script>
var 전체 = [], 선택 = "전체";

fetch("/data/cars.json?" + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){
    전체 = d.cars || [];
    document.getElementById("sub").textContent =
      "총 " + d.count + "대 · " + d.updated + " 기준 · 차량을 누르면 상세 정보로 이동합니다";
    필터만들기(); 그리기();
  })
  .catch(function(){ document.getElementById("sub").textContent = "차량 정보를 불러오지 못했습니다."; });

function 필터만들기(){
  var makers = ["전체"];
  전체.forEach(function(c){ if (makers.indexOf(c.maker) < 0) makers.push(c.maker); });
  document.getElementById("filters").innerHTML =
    makers.map(function(m){
      var n = m === "전체" ? 전체.length : 전체.filter(function(c){ return c.maker === m; }).length;
      return '<button class="chip' + (m === 선택 ? " on" : "") + '" data-m="' + m + '">' + m + " " + n + "</button>";
    }).join("") +
    '<select class="sortsel" id="sort">' +
    '<option value="price-desc">높은 가격순</option><option value="price-asc">낮은 가격순</option>' +
    '<option value="km-asc">주행거리 짧은순</option><option value="year-desc">연식 최신순</option></select>';

  document.getElementById("filters").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    선택 = b.dataset.m;
    document.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("on", x.dataset.m === 선택); });
    그리기();
  });
  document.getElementById("sort").addEventListener("change", 그리기);
}

function 그리기(){
  var list = 선택 === "전체" ? 전체.slice() : 전체.filter(function(c){ return c.maker === 선택; });
  var s = (document.getElementById("sort") || {}).value || "price-desc";
  list.sort(function(a, b){
    if (s === "price-asc") return a.price - b.price;
    if (s === "km-asc")    return a.mileage - b.mileage;
    if (s === "year-desc") return (b.yearRaw || "").localeCompare(a.yearRaw || "");
    return b.price - a.price;
  });
  document.getElementById("grid").innerHTML = list.map(매물카드).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}
</script>
</body>
</html>
