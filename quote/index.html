<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="티어원견적서">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="tierone-logo.png">
    <title>TierONE 차량 견적서</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        /* TierONE 견적서 — 홈페이지와 같은 검정·보라, Pretendard */
        :root { --bk: #0a0a0c; --ink: #15151a; --sub: #6b6c78; --line: #e7e7ec; --bg: #f3f3f6; --pp: #8B2FFF; --pp2: #6d1fe0; --ppbg: #f3ecff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        button, input, select { font-family: inherit; }

        /* 머리 */
        .header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; background: var(--bk); color: #fff; }
        .header .logo-wrap { width: 34px; height: 34px; flex-shrink: 0; }
        .header .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .header-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
        .header-text h1 em { font-style: normal; color: #a55cff; }
        .header-text p { font-size: 12px; color: #a8a9b3; margin-top: 2px; }
        .header .tel { margin-left: auto; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 14px;
            border-radius: 999px; background: var(--pp); white-space: nowrap; }

        /* 배치 */
        .main-wrapper { max-width: 1120px; margin: 0 auto; padding: 0 0 40px; }
        .content-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; padding: 18px; align-items: start; }
        @media (max-width: 860px) { .content-layout { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; } }
        .quote-section, .calc-section { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
        .calc-section { padding: 0; overflow: hidden; }
        @media (max-width: 520px) { .quote-section { padding: 18px 16px; } }

        /* 견적서 위쪽 (공유 이미지에도 들어간다) */
        .quote-brand { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 2px solid var(--ink); }
        .quote-brand b { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
        .quote-brand b em { font-style: normal; color: var(--pp); }
        .quote-brand span { font-size: 12px; color: var(--sub); text-align: right; line-height: 1.5; }
        .section-title { display: none; }
        .section-icon { display: none; }

        /* 감면·도구 줄 */
        .exempt-row { display: flex; align-items: center; gap: 8px; }
        .exempt-checkbox { width: 18px; height: 18px; accent-color: var(--pp); cursor: pointer; flex-shrink: 0; }
        .exempt-label { font-size: 14px; font-weight: 600; cursor: pointer; }
        .exempt-info-btn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #c9c9d1; background: #fff; color: var(--sub); font-size: 11px; font-weight: 700; cursor: pointer; }
        .reset-btn { padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
        .reset-btn:hover { border-color: #c9c9d1; }
        .exempt-options-wrap { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; padding: 12px; border-radius: 14px; background: var(--bg); }
        .exempt-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); cursor: pointer; }
        .exempt-option.active { border-color: var(--pp); box-shadow: 0 0 0 3px var(--ppbg); }
        .exempt-option-label { font-size: 13px; font-weight: 600; white-space: nowrap; min-width: 92px; }

        /* 차량 검색 */
        .search-box { background: var(--bg); padding: 14px; border-radius: 14px; margin: 14px 0 16px; }
        .search-box > label { display: block; font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 8px; letter-spacing: .2px; }
        .search-input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; font-weight: 600; outline: none; background: #fff; }
        .search-input:focus { border-color: var(--pp); box-shadow: 0 0 0 3px var(--ppbg); }
        .search-btn { padding: 0 20px; background: var(--ink); color: #fff; border: 0; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .car-picked { margin-top: 10px; padding: 12px 14px; background: #fff; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; line-height: 1.7; }
        .car-picked b { display: inline-block; min-width: 64px; color: var(--sub); font-weight: 600; font-size: 12px; }
        .car-picked .ok { text-align: right; margin-top: 2px; font-size: 12px; color: var(--pp); font-weight: 700; }
        .car-option { padding: 10px 12px; background: #fff; border-radius: 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; border: 1px solid var(--line); }
        .car-option:hover { border-color: var(--pp); }

        /* 입력 */
        .form-group { margin-bottom: 14px; }
        .form-group > label { display: block; font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; letter-spacing: .2px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-suffix { position: relative; display: flex; align-items: center; }
        .input-suffix input, .form-group select { width: 100%; height: 52px; padding: 13px 44px 13px 16px; line-height: 24px; border: 1px solid var(--line); border-radius: 12px;
            font-size: 18px; font-weight: 700; color: var(--ink); background: #fff; outline: none; text-align: right; -moz-appearance: textfield; }
        .form-group select { text-align: left; padding: 0 14px; font-size: 16px; line-height: normal; }
        .input-suffix input::-webkit-outer-spin-button, .input-suffix input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-suffix input::placeholder { color: #b6b7c0; font-weight: 500; font-size: 15px; }
        .input-suffix input:focus, .form-group select:focus { border-color: var(--pp); box-shadow: 0 0 0 3px var(--ppbg); }
        .input-suffix input:disabled { background: var(--bg); color: #b6b7c0; }
        .input-suffix .suffix { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); line-height: 1; font-size: 14px; color: var(--sub); font-weight: 600; pointer-events: none; }
        .exempt-option .input-suffix input { height: 40px; padding-top: 8px; padding-bottom: 8px; font-size: 15px; }

        /* 견적 내역 */
        .result-card { margin-top: 18px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
        .result-card h3 { font-size: 13px; font-weight: 700; color: var(--sub); padding: 14px 18px 6px; }
        .result-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 18px; font-size: 15px; }
        .result-row .label { color: var(--sub); }
        .result-row .value { font-weight: 700; }
        .result-divider { border: 0; border-top: 1px dashed var(--line); margin: 6px 18px 0; }
        .result-total { display: flex; justify-content: space-between; align-items: center; padding: 18px; margin-top: 10px; background: var(--bk); color: #fff; }
        .result-total .label { font-size: 15px; font-weight: 700; }
        .result-total .value { font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: #c9a4ff; }
        .apply-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; background: var(--bk); padding-top: 0; }
        .calc-btn { height: 44px; border-radius: 12px; border: 0; background: var(--pp); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
        .calc-btn.lease-btn { background: #26262e; }

        /* 입금 계좌 */
        .schedule-toggle { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 12px; }
        .bank-info { margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: var(--bg); }
        .bank-detail { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bank-name { padding: 4px 9px; border-radius: 7px; color: #fff; font-size: 12px; font-weight: 700; }
        .bank-account { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
        .bank-holder { font-size: 12px; color: var(--sub); margin-top: 6px; }

        /* 할부·리스 */
        .tab-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 14px; padding: 4px; border-radius: 12px; background: var(--bg); }
        .tab-btn { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--sub); font-size: 14px; font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .tab-content { padding: 4px 18px 20px; }
        .loan-highlight { margin: 6px 0 14px; padding: 20px; border-radius: 16px; background: var(--bk); color: #fff; text-align: center; }
        .loan-highlight.lease-color { background: #26262e; }
        .monthly-label { font-size: 13px; color: #a8a9b3; font-weight: 600; }
        .monthly-amount { font-size: 34px; font-weight: 800; letter-spacing: -.8px; margin-top: 4px; color: #c9a4ff; }
        .monthly-unit { font-size: 16px; color: #fff; font-weight: 700; }
        .loan-result { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
        .loan-result h3 { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
        .loan-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: var(--sub); }
        .loan-row .value { color: var(--ink); font-weight: 700; }
        .lease-th { font-size: 13px; }
        .schedule-scroll { max-height: 320px; overflow: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .schedule-table th { position: sticky; top: 0; background: var(--bg); padding: 9px 8px; font-weight: 700; color: var(--sub); text-align: right; }
        .schedule-table td { padding: 8px; border-top: 1px solid var(--line); text-align: right; }

        /* 감면 안내 창 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(10,10,12,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-box { background: #fff; border-radius: 18px; padding: 22px; max-width: 460px; width: 100%; }
        .modal-box h3 { font-size: 17px; margin-bottom: 12px; }
        .modal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .modal-table th, .modal-table td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
        .modal-table th { color: var(--sub); font-weight: 700; }
        .modal-note { font-size: 12px; color: var(--sub); margin-top: 10px; }
        .modal-close { width: 100%; height: 46px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }

        .footer { text-align: center; font-size: 12px; color: var(--sub); padding: 6px 16px 0; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function CarQuoteApp() {
            // 견적서 상태
            // 금액 칸: 화면엔 쉼표, 값은 숫자만
            const comma = v => { const d = String(v == null ? '' : v).replace(/[^0-9]/g, ''); return d ? Number(d).toLocaleString() : ''; };
            const digits = v => String(v == null ? '' : v).replace(/[^0-9]/g, '');
            const [carPrice, setCarPrice] = React.useState('');
            const [insurancePrice, setInsurancePrice] = React.useState('');
            const [showBank, setShowBank] = React.useState(false);

            // 차량번호 검색
            // 차량 검색은 TierONE 업무관리 재고에서 (차량번호·차명·성능보험료만) — 예전 구글시트 대신
            const APPS_SCRIPT_URL = 'https://fwqtyyjhfewpxihpaasu.supabase.co/functions/v1/quote';
            const [searchKeyword, setSearchKeyword] = React.useState('');
            const [searchResults, setSearchResults] = React.useState(null);
            const [searchLoading, setSearchLoading] = React.useState(false);
            const [selectedCar, setSelectedCar] = React.useState(null);

            // 관리자 모드 (로고 3번 탭)
            const [adminMode, setAdminMode] = React.useState(false);
            const tapCount = React.useRef(0);
            const tapTimer = React.useRef(null);

            const handleLogoTap = () => {
                tapCount.current += 1;
                clearTimeout(tapTimer.current);
                tapTimer.current = setTimeout(() => { tapCount.current = 0; }, 1000);
                if (tapCount.current >= 3) {
                    setAdminMode(!adminMode);
                    tapCount.current = 0;
                }
            };

            // 탭 상태
            const [activeTab, setActiveTab] = React.useState('installment');

            // 할부 계산기 상태
            const [loanAmount, setLoanAmount] = React.useState('0');
            const [interestRate, setInterestRate] = React.useState('0');
            const [loanMonths, setLoanMonths] = React.useState('60');
            const [showSchedule, setShowSchedule] = React.useState(false);

            // 리스 계산기 상태
            const [leaseType, setLeaseType] = React.useState('operating');
            const [leaseCarPrice, setLeaseCarPrice] = React.useState('0');
            const [leaseAdvance, setLeaseAdvance] = React.useState('0');
            const [leaseResidual, setLeaseResidual] = React.useState('30');
            const [leaseRate, setLeaseRate] = React.useState('9');
            const [leaseMonths, setLeaseMonths] = React.useState('60');
            const [showLeaseSchedule, setShowLeaseSchedule] = React.useState(false);
            const [taxExempt, setTaxExempt] = React.useState(false);
            const [exemptMode, setExemptMode] = React.useState(null); // 'amount' | 'percent' | 'transfer'
            const [exemptAmount, setExemptAmount] = React.useState('');
            const [exemptPercent, setExemptPercent] = React.useState('');
            const [customTransferFee, setCustomTransferFee] = React.useState('');
            const [showExemptModal, setShowExemptModal] = React.useState(false);

            // 차량번호 검색 함수
            // kw 를 주면 그 번호로 (업무관리 [견적서 만들기] → ?car=번호&price=판매가 로 열 때)
            const searchCar = (kw) => {
                kw = typeof kw === 'string' ? kw : searchKeyword;
                if (!kw || kw.length < 2) {
                    alert('최소 2자리 이상 입력해주세요');
                    return;
                }
                setSearchLoading(true);
                setSelectedCar(null);
                fetch(APPS_SCRIPT_URL + '?q=' + encodeURIComponent(kw))
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        setSearchResults(data);
                        if (data.length === 1) {
                            setSelectedCar(data[0]);
                            var ins = String(data[0].insurance).replace(/[^0-9]/g, '');
                            setInsurancePrice(ins);
                        }
                        setSearchLoading(false);
                    })
                    .catch(function() {
                        alert('검색 실패: 네트워크를 확인해주세요');
                        setSearchResults(null);
                        setSearchLoading(false);
                    });
            };

            React.useEffect(() => {
                const p = new URLSearchParams(location.search);
                const car = (p.get('car') || '').trim(), price = (p.get('price') || '').replace(/[^0-9]/g, '');
                if (price) setCarPrice(price);
                if (car) { setSearchKeyword(car); searchCar(car); }
            }, []);

            const applyCar = (car) => {
                setSelectedCar(car);
                const ins = String(car.insurance).replace(/[^0-9]/g, '');
                setInsurancePrice(ins);
            };

            // 견적 상수
            const FIXED_SALE_FEE = 440000;
            const TRANSFER_RATE = 0.075;

            // 견적 계산
            const calculateQuote = () => {
                const price = Number(carPrice);
                if (!price) return null;
                const rawTransferFee = Math.floor(price * TRANSFER_RATE);
                const transferFee = !taxExempt || !exemptMode ? rawTransferFee
                    : exemptMode === 'amount' ? Math.max(0, rawTransferFee - (Number(exemptAmount) || 0))
                    : exemptMode === 'percent' ? Math.floor(rawTransferFee * (1 - (Number(exemptPercent) || 0) / 100))
                    : (Number(customTransferFee) || 0);
                const insurance = Number(insurancePrice) || 0;
                const total = price + FIXED_SALE_FEE + transferFee + insurance;
                return { carPrice: price, saleFee: FIXED_SALE_FEE, transferFee, insurance, total };
            };

            // 원리금균등상환 계산 (할부)
            const calculateLoan = () => {
                const P = Number(loanAmount);
                const annualRate = Number(interestRate);
                const n = Number(loanMonths);
                if (!P || !annualRate || !n) return null;

                const r = annualRate / 100 / 12;
                const monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
                const totalPayment = monthly * n;
                const totalInterest = totalPayment - P;

                let balance = P;
                const schedule = [];
                for (let i = 1; i <= n; i++) {
                    const interest = balance * r;
                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }
                return { monthly, totalPayment, totalInterest, schedule };
            };

            // 리스 계산
            const calculateLease = () => {
                const carP = Number(leaseCarPrice);
                const annualRate = Number(leaseRate);
                const n = Number(leaseMonths);
                if (!carP || !annualRate || !n) return null;

                const advanceAmount = Number(leaseAdvance) || 0;
                const residualAmount = leaseType === 'operating' ? carP * (Number(leaseResidual) / 100) : 0;
                const rawTransferFee = carP * 0.075;
                const transferFee = !taxExempt || !exemptMode ? rawTransferFee
                    : exemptMode === 'amount' ? Math.max(0, rawTransferFee - (Number(exemptAmount) || 0))
                    : exemptMode === 'percent' ? rawTransferFee * (1 - (Number(exemptPercent) || 0) / 100)
                    : (Number(customTransferFee) || 0);
                const leasePrincipal = carP - advanceAmount + transferFee;
                const r = annualRate / 100 / 12;

                const compoundFactor = Math.pow(1 + r, n);
                const monthly = (leasePrincipal * compoundFactor - residualAmount) * r / (compoundFactor - 1);

                const totalPayment = monthly * n + advanceAmount;
                const totalInterest = totalPayment - (carP - residualAmount);

                let balance = leasePrincipal;
                const schedule = [];
                for (let i = 1; i <= n; i++) {
                    const interest = balance * r;
                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }

                return {
                    monthly,
                    advanceAmount,
                    residualAmount,
                    leasePrincipal,
                    totalPayment,
                    totalInterest,
                    schedule
                };
            };

            const quoteResult = calculateQuote();
            const loanResult = calculateLoan();
            const leaseResult = calculateLease();

            const handleReset = () => {
                setCarPrice('');
                setInsurancePrice('');
                setSearchKeyword('');
                setSearchResults(null);
                setSelectedCar(null);
                setLoanAmount('0');
                setInterestRate('0');
                setLoanMonths('60');
                setLeaseCarPrice('0');
                setLeaseAdvance('0');
                setLeaseResidual('30');
                setLeaseRate('9');
                setLeaseMonths('60');
                setTaxExempt(false);
                setCustomTransferFee('');
                setShowSchedule(false);
                setShowLeaseSchedule(false);
                setShowBank(false);
                setActiveTab('installment');
            };

            const shareCanvas = (target, fileNamePrefix, title) => {
                if (!target) return;
                html2canvas(target, {scale: 2, useCORS: true, backgroundColor: '#ffffff'}).then(function(canvas) {
                    canvas.toBlob(function(blob) {
                        var fileName = fileNamePrefix + '_' + new Date().toISOString().slice(0,10) + '.png';
                        var file = new File([blob], fileName, {type: 'image/png'});
                        if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
                            navigator.share({files: [file], title: title});
                        } else {
                            var link = document.createElement('a');
                            link.download = fileName;
                            link.href = URL.createObjectURL(blob);
                            link.click();
                        }
                    }, 'image/png');
                });
            };

            const handleCaptureQuote = () => {
                shareCanvas(document.querySelector('.quote-section'), '티어원_견적서', 'TierONE 견적서');
            };
            const handleCaptureCalc = () => {
                shareCanvas(document.querySelector('.calc-section'), '티어원_할부견적', 'TierONE 할부 견적');
            };

            const applyToLoan = () => {
                if (quoteResult) {
                    setLoanAmount(String(quoteResult.total));
                    setActiveTab('installment');
                }
            };
            const applyToLease = () => {
                if (quoteResult) {
                    setLeaseCarPrice(String(quoteResult.carPrice));
                    setActiveTab('lease');
                }
            };

            const fmtWon = (num) => Math.round(num).toLocaleString();

            return (
                <div className="main-wrapper">

                    {/* 취등록세 감면 팝업 모달 */}
                    {showExemptModal && (
                        <div className="modal-overlay" onClick={() => setShowExemptModal(false)}>

                                                            <tr>
                                                                <th className="lease-th">회차</th>
                                                                <th className="lease-th">월리스료</th>
                                                                <th className="lease-th">원금</th>
                                                                <th className="lease-th">이자</th>
                                                                <th className="lease-th">잔액</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {leaseResult.schedule.map((row) => (
                                                                <tr key={row.month}>
                                                                    <td style={{textAlign: 'center'}}>{row.month}</td>
                                                                    <td>{fmtWon(row.payment)}</td>
                                                                    <td>{fmtWon(row.principal)}</td>
                                                                    <td>{fmtWon(row.interest)}</td>
                                                                    <td>{fmtWon(row.balance)}</td>

                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}

                                </div>
                            )}
                        </div>
                    </div>

                    <div className="footer">
                        &copy; TierONE. 본 견적서는 참고용이며, 실제 금액은 상이할 수 있습니다.
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CarQuoteApp />, document.getElementById('root'));
    </script>
