<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2a1d45">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="티어원견적서">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="tierone-logo.png">
    <title>TierONE 차량 견적서</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', 'Noto Sans KR', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #dce3ed 100%);
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 22px 24px;
            background: linear-gradient(135deg, #2a1d45 0%, #5b3a93 50%, #2a1d45 100%);
            border-radius: 16px 16px 0 0;
            color: white;
            box-shadow: 0 4px 15px rgba(42, 29, 69, 0.3);
        }
        .header .logo-wrap {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header .logo-wrap img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .header-text h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .header-text p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* 메인 레이아웃 */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .content-layout {
            display: flex;
            gap: 0;
        }

        /* 좌측: 견적서 */
        .quote-section {
            flex: 1;
            padding: 28px;
            border-right: 1px solid #eee;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #2a1d45;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #5b3a93;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-icon {
            width: 28px;
            height: 28px;
            background: #5b3a93;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* 계좌 안내 */
        .bank-info {
            margin-top: 24px;
            padding: 18px;
            background: linear-gradient(135deg, #f0f4f8, #e8edf3);
            border-radius: 12px;
            border: 2px solid #5b3a93;
        }
        .bank-info h3 {
            font-size: 15px;
            color: #2a1d45;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #c8d0dc;
        }
        .bank-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .bank-name {
            background: #5b3a93;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .bank-account {
            font-size: 18px;
            font-weight: 800;
            color: #2a1d45;
            letter-spacing: 0.5px;
        }
        .bank-holder {
            font-size: 14px;
            color: #5a6a7a;
            font-weight: 600;
        }

        /* 우측: 계산기 패널 */
        .calc-section {
            width: 400px;
            min-width: 360px;
            padding: 0;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
        }

        /* 탭 스타일 */
        .tab-bar {
            display: flex;
            background: #e8ecf2;
            border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 700;
            color: #8e99a9;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .tab-btn.active {
            background: #f8f9fb;
            color: #5b3a93;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #5b3a93;
        }
        .tab-btn:not(.active):hover {
            background: #dde2ea;
        }
        .tab-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #34495e;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
            -webkit-appearance: none;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #5b3a93;
            box-shadow: 0 0 0 3px rgba(44, 62, 107, 0.1);
        }
        .input-suffix {
            position: relative;
        }
        .input-suffix input {
            padding-right: 40px;
        }
        .input-suffix .suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }

        /* 견적 결과 */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fb 0%, #fff 100%);
            border-radius: 12px;
            border: 1px solid #e2e6ed;
        }
        .result-card h3 {
            font-size: 17px;
            color: #2a1d45;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #dee2e6;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 15px;
            color: #495057;
        }
        .result-row .label {
            color: #6c757d;
        }
        .result-row .value {
            font-weight: 600;
            color: #2a1d45;
        }
        .result-row.sub-note {
            font-size: 12px;
            color: #adb5bd;
            padding: 0 0 8px 0;
            justify-content: flex-end;
        }
        .result-divider {
            border: none;
            border-top: 2px dashed #dee2e6;
            margin: 8px 0;
        }
        .result-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 4px;
            font-size: 20px;
            font-weight: 800;
        }
        .result-total .label {
            color: #2a1d45;
        }
        .result-total .value {
            color: #5b3a93;
        }

        /* 할부/리스 결과 */
        .loan-result {
            margin-top: 16px;
            padding: 18px;
            background: white;
            border-radius: 12px;
            border: 2px solid #5b3a93;
        }
        .loan-result h3 {
            font-size: 16px;
            color: #5b3a93;
            margin-bottom: 12px;
        }
        .loan-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: #495057;
        }
        .loan-row .value {
            font-weight: 600;
        }
        .loan-highlight {
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #2a1d45, #5b3a93);
            border-radius: 10px;
            text-align: center;
            color: white;
        }
        .loan-highlight.lease-color {
            background: linear-gradient(135deg, #1a6b5a, #27ae60);
        }
        .loan-highlight .monthly-label {
            font-size: 13px;
            opacity: 0.9;
        }
        .loan-highlight .monthly-amount {
            font-size: 26px;
            font-weight: 800;
            margin-top: 4px;
        }
        .loan-highlight .monthly-unit {
            font-size: 14px;
            font-weight: 400;
        }

        .lease-border {
            border-color: #27ae60;
        }
        .lease-border h3 {
            color: #1a6b5a;
        }

        /* 계산 버튼 */
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2a1d45, #5b3a93);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }
        .calc-btn:hover {
            box-shadow: 0 4px 12px rgba(42, 29, 69, 0.4);
        }
        .apply-btns {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .apply-btns .calc-btn {
            margin-top: 0;
            font-size: 13px;
            padding: 10px 8px;
        }
        .apply-btns .calc-btn.lease-btn {
            background: linear-gradient(135deg, #1a6b5a, #27ae60);
        }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 16px;
            background: #f8f9fb;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #adb5bd;
        }

        /* 스케줄 테이블 */
        .schedule-toggle {
            width: 100%;
            padding: 10px;
            background: #f0f2f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            color: #495057;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .schedule-toggle:hover {
            background: #e2e6ea;
        }
        .schedule-table {
            width: 100%;
            margin-top: 12px;
            border-collapse: collapse;
            font-size: 11px;
        }
        .schedule-table th {
            background: #5b3a93;
            color: white;
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .schedule-table th.lease-th {
            background: #1a6b5a;
        }
        .schedule-table td {
            padding: 6px 4px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
        }
        .schedule-table tr:nth-child(even) {
            background: #fafafa;
        }
        .schedule-scroll {
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        /* 리스 타입 선택 */
        .lease-type-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lease-type-btn {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .lease-type-btn.active {
            border-color: #27ae60;
            color: #1a6b5a;
            background: #e8f8f0;
        }

        /* 반응형 - 태블릿 세로 */
        @media (max-width: 900px) {
            .content-layout {
                flex-direction: column;
            }
            .quote-section {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            .calc-section {
                width: 100%;
                min-width: auto;
            }
        }

        /* 인쇄 스타일 */
        @media print {
            body { background: white; padding: 0; }
            .main-wrapper { box-shadow: none; }
            .calc-btn, .schedule-toggle, .tab-bar, .apply-btns { display: none; }
        }

        /* 초기화 버튼 */
        .reset-btn {
            background: #f1f3f5; color: #495057; border: 1px solid #dee2e6;
            border-radius: 8px; padding: 8px 11px; font-size: 13px;
            cursor: pointer; font-weight: 600; transition: all 0.2s;
        }
        .reset-btn:hover { background: #e9ecef; }

        /* 감면 체크박스 영역 */
        .exempt-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .exempt-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #3498db; }
        .exempt-label { font-size: 14px; font-weight: 600; color: #2c3e50; cursor: pointer; }
        .exempt-info-btn {
            background: none; border: 1px solid #3498db; color: #3498db;
            border-radius: 50%; width: 20px; height: 20px; font-size: 11px;
            font-weight: 700; cursor: pointer; line-height: 1; padding: 0;
        }
        .exempt-input-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .exempt-input-wrap input { flex: 1; }
        .exempt-options-wrap {
            background: #f0f4f8;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .exempt-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e8ecf0;
            padding: 10px 12px;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }
        .exempt-option.active {
            border-color: #3498db;
            background: #eaf4fd;
        }
        .exempt-option-label {
            font-size: 13px;
            font-weight: 600;
            color: #6c757d;
            white-space: nowrap;
            min-width: 90px;
        }
        .exempt-option.active .exempt-option-label { color: #1a6b9a; }
        .exempt-option .input-suffix input { font-size: 14px; padding: 8px 36px 8px 10px; border-radius: 8px; border: 1.5px solid #e0e0e0; width: 100%; }
        .exempt-option.active .input-suffix input { border-color: #3498db; background: white; }
        .exempt-option .input-suffix input:disabled { background: #f5f7f9; color: #ccc; cursor: not-allowed; border-color: #e8ecf0; }

        /* 팝업 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            background: #fff; border-radius: 16px; padding: 28px;
            max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-box h3 { margin: 0 0 16px; font-size: 17px; color: #2c3e50; }
        .modal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .modal-table th {
            background: #3498db; color: #fff; padding: 9px 12px;
            text-align: left; font-weight: 600;
        }
        .modal-table td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
        .modal-table tr:last-child td { border-bottom: none; }
        .modal-table tr:nth-child(even) td { background: #f8f9fa; }
        .modal-note { font-size: 12px; color: #888; margin-top: 12px; }
        .modal-close {
            display: block; width: 100%; margin-top: 18px; padding: 11px;
            background: #3498db; color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .modal-close:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function CarQuoteApp() {
            // 견적서 상태
            const [carPrice, setCarPrice] = React.useState('');
            const [insurancePrice, setInsurancePrice] = React.useState('');
            const [showBank, setShowBank] = React.useState(false);

            // 차량번호 검색
            // 차량 검색은 TierONE 업무관리 재고에서 (차량번호·차명·성능보험료만) — 예전 구글시트 대신
            const APPS_SCRIPT_URL = 'https://fwqtyyjhfewpxihpaasu.supabase.co/functions/v1/quote';
            const [searchKeyword, setSearchKeyword] = React.useState('');
            const [searchResults, setSearchResults] = React.useState(null);
            const [searchLoading, setSearchLoading] = React.useState(false);
            const [selectedCar, setSelectedCar] = React.useState(null);

            // 관리자 모드 (로고 3번 탭)
            const [adminMode, setAdminMode] = React.useState(false);
            const tapCount = React.useRef(0);
            const tapTimer = React.useRef(null);

            const handleLogoTap = () => {
                tapCount.current += 1;
                clearTimeout(tapTimer.current);
                tapTimer.current = setTimeout(() => { tapCount.current = 0; }, 1000);
                if (tapCount.current >= 3) {
                    setAdminMode(!adminMode);
                    tapCount.current = 0;
                }
            };

            // 탭 상태
            const [activeTab, setActiveTab] = React.useState('installment');

            // 할부 계산기 상태
            const [loanAmount, setLoanAmount] = React.useState('0');
            const [interestRate, setInterestRate] = React.useState('0');
            const [loanMonths, setLoanMonths] = React.useState('60');
            const [showSchedule, setShowSchedule] = React.useState(false);

            // 리스 계산기 상태
            const [leaseType, setLeaseType] = React.useState('operating');
            const [leaseCarPrice, setLeaseCarPrice] = React.useState('0');
            const [leaseAdvance, setLeaseAdvance] = React.useState('0');
            const [leaseResidual, setLeaseResidual] = React.useState('30');
            const [leaseRate, setLeaseRate] = React.useState('9');
            const [leaseMonths, setLeaseMonths] = React.useState('60');
            const [showLeaseSchedule, setShowLeaseSchedule] = React.useState(false);
            const [taxExempt, setTaxExempt] = React.useState(false);
            const [exemptMode, setExemptMode] = React.useState(null); // 'amount' | 'percent' | 'transfer'
            const [exemptAmount, setExemptAmount] = React.useState('');
            const [exemptPercent, setExemptPercent] = React.useState('');
            const [customTransferFee, setCustomTransferFee] = React.useState('');
            const [showExemptModal, setShowExemptModal] = React.useState(false);

            // 차량번호 검색 함수
            // kw 를 주면 그 번호로 (업무관리 [견적서 만들기] → ?car=번호&price=판매가 로 열 때)
            const searchCar = (kw) => {
                kw = typeof kw === 'string' ? kw : searchKeyword;
                if (!kw || kw.length < 2) {
                    alert('최소 2자리 이상 입력해주세요');
                    return;
                }
                setSearchLoading(true);
                setSelectedCar(null);
                fetch(APPS_SCRIPT_URL + '?q=' + encodeURIComponent(kw))
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        setSearchResults(data);
                        if (data.length === 1) {
                            setSelectedCar(data[0]);
                            var ins = String(data[0].insurance).replace(/[^0-9]/g, '');
                            setInsurancePrice(ins);
                        }
                        setSearchLoading(false);
                    })
                    .catch(function() {
                        alert('검색 실패: 네트워크를 확인해주세요');
                        setSearchResults(null);
                        setSearchLoading(false);
                    });
            };

            React.useEffect(() => {
                const p = new URLSearchParams(location.search);
                const car = (p.get('car') || '').trim(), price = (p.get('price') || '').replace(/[^0-9]/g, '');
                if (price) setCarPrice(price);
                if (car) { setSearchKeyword(car); searchCar(car); }
            }, []);

            const applyCar = (car) => {
                setSelectedCar(car);
                const ins = String(car.insurance).replace(/[^0-9]/g, '');
                setInsurancePrice(ins);
            };

            // 견적 상수
            const FIXED_SALE_FEE = 440000;
            const TRANSFER_RATE = 0.075;

            // 견적 계산
            const calculateQuote = () => {
                const price = Number(carPrice);
                if (!price) return null;
                const rawTransferFee = Math.floor(price * TRANSFER_RATE);
                const transferFee = !taxExempt || !exemptMode ? rawTransferFee
                    : exemptMode === 'amount' ? Math.max(0, rawTransferFee - (Number(exemptAmount) || 0))
                    : exemptMode === 'percent' ? Math.floor(rawTransferFee * (1 - (Number(exemptPercent) || 0) / 100))
                    : (Number(customTransferFee) || 0);
                const insurance = Number(insurancePrice) || 0;
                const total = price + FIXED_SALE_FEE + transferFee + insurance;
                return { carPrice: price, saleFee: FIXED_SALE_FEE, transferFee, insurance, total };
            };

            // 원리금균등상환 계산 (할부)
            const calculateLoan = () => {
                const P = Number(loanAmount);
                const annualRate = Number(interestRate);
                const n = Number(loanMonths);
                if (!P || !annualRate || !n) return null;

                const r = annualRate / 100 / 12;
                const monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
                const totalPayment = monthly * n;
                const totalInterest = totalPayment - P;

                let balance = P;
                const schedule = [];
                for (let i = 1; i <= n; i++) {
                    const interest = balance * r;
                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }
                return { monthly, totalPayment, totalInterest, schedule };
            };

                const n = Number(leaseMonths);

                const advanceAmount = Number(leaseAdvance) || 0;

                    : (Number(customTransferFee) || 0);
                const leasePrincipal = carP - advanceAmount + transferFee;
                const r = annualRate / 100 / 12;

                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }

                    advanceAmount,
                    residualAmount,
                    leasePrincipal,

                            {activeTab === 'lease' && (
                                <div className="tab-content">
                                    <div style={{display:'flex', justifyContent:'flex-end', marginBottom: '12px'}}>
                                        <button className="reset-btn" onClick={handleCaptureCalc}>📤 공유</button>
                                    </div>

                                    <div className="form-group">
                                        <label>차량가격</label>
                                        <div className="input-suffix">
                                            <input
                                                type="number"
                                                value={leaseCarPrice}
                                                onChange={(e) => setLeaseCarPrice(e.target.value)}
                                                placeholder="차량가격"
                                                inputMode="numeric"
                                            />
                                            <span className="suffix">원</span>
                                        </div>
                                    </div>

                                    <div className="form-group">
                                        <label>선수금</label>
                                        <div className="input-suffix">
                                            <input
                                                type="number"
                                                value={leaseAdvance}
                                                onChange={(e) => setLeaseAdvance(e.target.value)}
                                                placeholder="선수금"
                                                inputMode="numeric"
                                            />
                                            <span className="suffix">원</span>
                                        </div>
                                    </div>
                                    {leaseType === 'operating' && (
                                        <div className="form-group">
                                            <label>잔존가치</label>
                                            <div className="input-suffix">
                                                <input
                                                    type="number"
                                                    value={leaseResidual}
                                                    onChange={(e) => setLeaseResidual(e.target.value)}
                                                    placeholder="잔존가치"
                                                    inputMode="decimal"
                                                    step="5"
                                                />
                                                <span className="suffix">%</span>
                                            </div>
                                        </div>
                                    )}

                                    <div className="form-row">
                                        {adminMode && (
                                            <div className="form-group">
                                                <label>연 이율</label>
                                                <div className="input-suffix">
                                                    <input
                                                        type="number"
                                                        value={leaseRate}
                                                        onChange={(e) => setLeaseRate(e.target.value)}
                                                        placeholder="이율"
                                                        inputMode="decimal"
                                                        step="0.1"
                                                        style={{borderColor: '#e74c3c', background: '#fff5f5'}}
                                                    />
                                                    <span className="suffix">%</span>
                                                </div>
                                            </div>
                                        )}
                                        <div className="form-group">
                                            <label>리스 기간</label>
                                            <select
                                                value={leaseMonths}
                                                onChange={(e) => setLeaseMonths(e.target.value)}
                                            >
                                                <option value="24">24개월</option>
                                                <option value="36">36개월</option>
                                                <option value="48">48개월</option>
                                                <option value="60">60개월</option>
                                            </select>
                                        </div>
                                    </div>

                                    {leaseResult && (
                                        <React.Fragment>
                                            <div className="loan-highlight lease-color">
                                                <div className="monthly-label">월 리스료</div>
                                                <div className="monthly-amount">
                                                    {fmtWon(leaseResult.monthly)}
                                                    <span className="monthly-unit"> 원</span>
                                                </div>
                                            </div>

                                            <div className="loan-result lease-border">
                                                <h3>리스 상세 정보</h3>
                                                <div className="loan-row">
                                                    <span>차량가격</span>
                                                    <span className="value">{Number(leaseCarPrice).toLocaleString()} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>선수금</span>
                                                    <span className="value">{fmtWon(leaseResult.advanceAmount)} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>리스원금</span>
                                                    <span className="value">{fmtWon(leaseResult.leasePrincipal)} 원</span>
                                                </div>
                                                {leaseType === 'operating' && (
                                                    <div className="loan-row">
                                                        <span>잔존가치 ({leaseResidual}%)</span>
                                                        <span className="value">{fmtWon(leaseResult.residualAmount)} 원</span>
                                                    </div>
                                                )}
                                                <p style={{fontSize: '11px', color: '#adb5bd', marginTop: '10px', whiteSpace: 'nowrap'}}>※ 실제 금리 및 조건은 금융사별로 상이하며, 본 계산은 참고용입니다.</p>
                                            </div>

                                            <button
                                                className="schedule-toggle"
                                                onClick={() => setShowLeaseSchedule(!showLeaseSchedule)}
                                            >
                                                {showLeaseSchedule ? '▲ 리스 스케줄 닫기' : '▼ 리스 스케줄 보기'}
                                            </button>

                                            {showLeaseSchedule && (
                                                <div className="schedule-scroll">
                                                    <table className="schedule-table">
                                                        <thead>
                                                            <tr>
                                                                <th className="lease-th">회차</th>
                                                                <th className="lease-th">월리스료</th>
                                                                <th className="lease-th">원금</th>
                                                                <th className="lease-th">이자</th>
                                                                <th className="lease-th">잔액</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {leaseResult.schedule.map((row) => (
                                                                <tr key={row.month}>
                                                                    <td style={{textAlign: 'center'}}>{row.month}</td>
                                                                    <td>{fmtWon(row.payment)}</td>
                                                                    <td>{fmtWon(row.principal)}</td>
                                                                    <td>{fmtWon(row.interest)}</td>
                                                                    <td>{fmtWon(row.balance)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </React.Fragment>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="footer">
                        &copy; TierONE. 본 견적서는 참고용이며, 실제 금액은 상이할 수 있습니다.
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CarQuoteApp />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
